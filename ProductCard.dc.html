<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;height:100%;transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease" style-hover="box-shadow:0 14px 34px -16px rgba(11,36,64,.28);border-color:#CBD5E1;transform:translateY(-2px)">
  <a href="#/producto/{{ c.id }}" style="display:block;text-decoration:none">
    <div style="position:relative;aspect-ratio:1/1;background:#F4F7FB;background-image:linear-gradient(#E7EDF4 1px,transparent 1px),linear-gradient(90deg,#E7EDF4 1px,transparent 1px);background-size:22px 22px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #E2E8F0;color:#9DB1C7">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="2.4" rx="0.6"></rect><path d="M9.7 4.4h4.6"></path><rect x="7.8" y="6" width="8.4" height="14" rx="1.7"></rect><path d="M7.8 13.2h8.4"></path></svg>
      <sc-if value="{{ c.hasImagen }}" hint-placeholder-val="{{ false }}">
        <img src="{{ c.imagen }}" alt="{{ c.nombre }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"/>
      </sc-if>
      <sc-if value="{{ c.hasBadge }}" hint-placeholder-val="{{ false }}">
        <span style="position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;overflow:hidden;font-family:'Hanken Grotesk',sans-serif;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:linear-gradient(120deg,#0E5FB5 0%,#2FA8E0 50%,#0E5FB5 100%);background-size:220% 100%;border-radius:999px;padding:7px 14px;box-shadow:0 10px 22px -8px rgba(14,95,181,.7),inset 0 0 0 1px rgba(255,255,255,.28);animation:amBadgeIn .55s cubic-bezier(.16,1,.3,1) both,amGradShift 6s ease-in-out infinite"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M12 2l2.2 6.4 6.4 2.2-6.4 2.2L12 19.2 9.8 12.8 3.4 10.6l6.4-2.2z"></path></svg>{{ c.badge }}<span aria-hidden="true" style="position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,.5) 50%,transparent 100%);animation:amShine 3.2s ease-in-out 1.1s infinite"></span></span>
      </sc-if>
      <span style="position:absolute;left:10px;bottom:10px;z-index:1;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.04em;color:#5A6B7B;background:#fff;border:1px solid #E2E8F0;border-radius:4px;padding:2px 7px">{{ c.presentacion }}</span>
    </div>
  </a>
  <div style="display:flex;flex-direction:column;gap:10px;padding:15px 16px 17px;flex:1">
    <a href="#/producto/{{ c.id }}" style="text-decoration:none"><h3 style="font-family:'Hanken Grotesk',sans-serif;font-size:17px;font-weight:700;color:#0B2440;line-height:1.22;letter-spacing:-.01em">{{ c.nombre }}</h3></a>
    <p style="font-size:13px;color:#5A6B7B;line-height:1.5;flex:1">{{ c.investigacion }}</p>
    <a href="#/producto/{{ c.id }}" style="width:100%;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#0E5FB5;color:#fff;text-decoration:none;border-radius:7px;padding:11px 16px;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:14.5px;transition:background .15s" style-hover="background:#0B4E97">Ver ficha<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:392},&quot;c&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
