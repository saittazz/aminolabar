<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;height:100%;transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease" style-hover="box-shadow:0 14px 34px -16px rgba(11,36,64,.28);border-color:#CBD5E1;transform:translateY(-2px)">
  <a href="#/producto/{{ c.id }}" style="display:block;text-decoration:none">
    <div style="position:relative;aspect-ratio:1/1;background:#F4F7FB;background-image:linear-gradient(#E7EDF4 1px,transparent 1px),linear-gradient(90deg,#E7EDF4 1px,transparent 1px);background-size:22px 22px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #E2E8F0;color:#9DB1C7">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="2.4" rx="0.6"></rect><path d="M9.7 4.4h4.6"></path><rect x="7.8" y="6" width="8.4" height="14" rx="1.7"></rect><path d="M7.8 13.2h8.4"></path></svg>
      <sc-if value="{{ c.hasImagen }}" hint-placeholder-val="{{ false }}">
        <img src="{{ c.imagen }}" alt="{{ c.nombre }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"/>
      </sc-if>
      <span style="position:absolute;left:10px;bottom:10px;z-index:1;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.04em;color:#5A6B7B;background:#fff;border:1px solid #E2E8F0;border-radius:4px;padding:2px 7px">{{ c.presentacion }}</span>
    </div>
  </a>
  <div style="display:flex;flex-direction:column;gap:10px;padding:15px 16px 17px;flex:1">
    <sc-if value="{{ c.enStock }}" hint-placeholder-val="{{ true }}">
      <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;font-weight:600;color:#15875A;background:rgba(31,169,113,.12);padding:4px 9px;border-radius:5px"><span style="width:6px;height:6px;border-radius:50%;background:#1FA971;display:inline-block"></span>En stock</span>
    </sc-if>
    <sc-if value="{{ c.sinStock }}" hint-placeholder-val="{{ false }}">
      <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;font-weight:600;color:#B45309;background:rgba(180,83,9,.1);padding:4px 9px;border-radius:5px"><span style="width:6px;height:6px;border-radius:50%;background:#D9962B;display:inline-block"></span>Sin stock</span>
    </sc-if>
    <a href="#/producto/{{ c.id }}" style="text-decoration:none"><h3 style="font-family:'Hanken Grotesk',sans-serif;font-size:17px;font-weight:700;color:#0B2440;line-height:1.22;letter-spacing:-.01em">{{ c.nombre }}</h3></a>
    <p style="font-size:13px;color:#5A6B7B;line-height:1.5;flex:1">{{ c.investigacion }}</p>
    <sc-if value="{{ c.hasCaps }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <sc-for list="{{ c.caps }}" as="cap" hint-placeholder-count="3">
          <button onClick="{{ cap.onClick }}" style="{{ cap.style }}">{{ cap.label }}</button>
        </sc-for>
      </div>
    </sc-if>
    <div>
      <div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">
        <sc-if value="{{ c.desde }}" hint-placeholder-val="{{ false }}"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7E93A8;text-transform:uppercase;letter-spacing:.06em">desde</span></sc-if>
        <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:23px;color:#0B2440">{{ c.usdText }}</span>
      </div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#5A6B7B;margin-top:3px">{{ c.arsText }}</div>
    </div>
    <sc-if value="{{ c.enStock }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ c.onAdd }}" style="width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#0E5FB5;color:#fff;border:none;border-radius:7px;padding:11px 16px;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:14.5px;cursor:pointer;transition:background .15s" style-hover="background:#0B4E97"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"></circle><circle cx="18" cy="20" r="1.3"></circle><path d="M2.5 3h2.2l2 11.2a1.6 1.6 0 0 0 1.6 1.3h8.7a1.6 1.6 0 0 0 1.6-1.3L21 7H6.2"></path></svg>Agregar al carrito</button>
    </sc-if>
    <sc-if value="{{ c.sinStock }}" hint-placeholder-val="{{ false }}">
      <a href="{{ c.whatsappHref }}" target="_blank" rel="noopener" style="width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#0E5FB5;border:1px solid #0E5FB5;border-radius:7px;padding:11px 16px;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13.5px;text-decoration:none;transition:background .15s,color .15s" style-hover="background:#0E5FB5;color:#fff">Consultar por disponibilidad</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:392},&quot;c&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
